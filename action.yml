name: dhall-resolve
description: Build and package Dhall sources as one file
author: Nikita Volkov
branding:
  color: blue
inputs:
  file:
    description: Path to source file
    required: true
  minify:
    description: Minify the output through CSE and DCE
    required: false
    default: 'false'
outputs:
  path:
    description: Path to the generated file
runs:
  using: docker
  image: docker://ghcr.io/nikita-volkov/dhall-resolve.github-action:b168ecbce02afa1aa206a5da8325e1a590371124
  env:
    file: ${{ inputs.file }}
    minify: ${{ inputs.minify }}
